<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Galeria</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAIHevrpglvhHK3IsxpnkHlWpxnuf5o1So",
  authDomain: "galeria-verifiedmodels.firebaseapp.com",
  projectId: "galeria-verifiedmodels",
  storageBucket: "galeria-verifiedmodels.firebasestorage.app",
  messagingSenderId: "684551560793",
  appId: "1:684551560793:web:3730a07d8d6ec737e3db48",
  measurementId: "G-YZZ0XWHLXM"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.cargar = async()=>{
  const snap = await getDocs(collection(db,"modelos"));
  let html="";
  snap.forEach(d=>{
    const m=d.data();
    html+=`<div style="border:1px solid #ccc;padding:10px;margin:10px;border-radius:12px">
      <b>${m.perfil||d.id}</b><br>
      ${m.foto_url? `<img src="${m.foto_url}" style="width:120px;border-radius:10px">` : 'Sin foto'}<br>
      ID: ${d.id}<br>
      <input type="text" id="url_${d.id}" placeholder="Pega URL de foto https://..." style="width:90%">
      <button onclick="guardarUrl('${d.id}')">Guardar URL</button><br><br>
      <input type="file" id="f_${d.id}" accept="image/*">
      <button onclick="subirComoBase64('${d.id}')">Subir sin Storage</button>
    </div>`;
  });
  document.getElementById('lista').innerHTML=html||"No hay modelos";
}

window.guardarUrl = async(id)=>{
  const url=document.getElementById('url_'+id).value.trim();
  if(!url) return alert("pon url");
  await setDoc(doc(db,"modelos",id),{foto_url:url,foto:url,url:url},{merge:true});
  alert("Guardado"); cargar();
}

window.subirComoBase64 = async(id)=>{
  const file=document.getElementById('f_'+id).files[0];
  if(!file) return alert("elige archivo");
  // Lo convertimos a URL temporal y lo guardamos como foto_url (si es pequeña <1MB)
  // Si es grande, mejor usa una URL externa tipo postimages.org
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const base64=e.target.result;
    if(base64.length > 900000) return alert("Foto muy pesada, súbela a https://postimages.org y pega la URL con el boton de arriba");
    await setDoc(doc(db,"modelos",id),{foto_url:base64,foto:base64},{merge:true});
    alert("Foto guardada sin Storage"); cargar();
  };
  reader.readAsDataURL(file);
}
cargar();
</script>
</head>
<body style="font-family:sans-serif">
<h2>Admin Galeria - Fix sin Storage</h2>
<button onclick="cargar()">Recargar</button>
<div id="lista">Cargando...</div>
<p>Si la foto pesa mucho, súbela a https://postimages.org copia "Direct link" y pégalo en "Pega URL"</p>
</body>
</html>
